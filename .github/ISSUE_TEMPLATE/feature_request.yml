name: 功能建议
description: 提议具有明确产品价值的能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户、场景和当前阻碍，不要只描述实现方案。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述可观察、可验收的产品行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 是否影响 API、磁盘格式、算法口径、Windows 或现有实验复现。
