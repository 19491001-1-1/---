name: 算法与实验建议
description: 讨论算法变体、实验对照或可视化改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明哪条算法规则、实验现象或结果展示需要改进。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 说明希望比较什么、怎样验证，不预先承诺一定提高利用率。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 是否影响 API、磁盘格式、算法口径、Windows 或现有实验复现。
