name: 缺陷报告
description: 报告算法、实验结果或可视化中的可复现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题可在最新版本复现，并移除输入中的敏感信息。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 发布版本或 Git 提交号
      placeholder: v1.0.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options: [Windows, macOS, Linux, 其他]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 包含命令、输入规模和必要配置
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与日志
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已检索现有 Issue，未发现重复问题。
          required: true
        - label: 这不是安全漏洞；安全问题将按 SECURITY.md 私下报告。
          required: true
